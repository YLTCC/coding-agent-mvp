[pytest]
asyncio_mode = auto
; NOTE (ASCII only: iniconfig reads this file with the locale default codec,
;       Chinese comments here crash collection on a GBK Windows box).
;
; This testpaths list IS the gate, not a note. A test file missing from it
; means its cases are "always green" -- never executed, yet they look like
; they pass. test_instance_isolation.py (6 isolation cases) and
; test_calculator.py (7 cases) were silently skipped for a long time.
; Every new test file MUST be listed here.
testpaths =
    test_tools.py
    test_output_budget.py
    test_llm_retry.py
    test_context_compression.py
    test_session_log.py
    test_instance_isolation.py
    test_calculator.py
    test_web_events.py
    test_web_approvals.py
    test_web_sessions.py
    test_web_api.py
